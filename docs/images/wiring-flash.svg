<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Flashing wiring: adapter 3V3 to 3V3, GND to GND, TX to SWS, optional RTS or DTR to RST</title>
  <rect width="760" height="380" rx="12" fill="#ffffff"/>
  <text x="24" y="38" font-size="20" font-weight="600" fill="#202124">Wiring for flashing</text>
  <text x="24" y="60" font-size="13" fill="#5f6368">Battery removed: the adapter powers the module. Adapter set to 3.3 V logic.</text>

  <!-- USB-UART adapter -->
  <g transform="translate(40,96)">
    <rect x="-28" y="78" width="34" height="56" rx="4" fill="#9aa0a6"/>
    <text x="-11" y="166" font-size="11" fill="#5f6368" text-anchor="middle">USB</text>
    <rect x="0" y="0" width="200" height="212" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
    <text x="70" y="30" font-size="15" font-weight="600" fill="#1a73e8" text-anchor="middle">USB-UART</text>
    <text x="70" y="48" font-size="12" fill="#3c4043" text-anchor="middle">CP2102 / CH340 / FT232</text>
    <rect x="22" y="64" width="96" height="22" rx="4" fill="#ffffff" stroke="#1a73e8"/>
    <text x="70" y="80" font-size="12" font-weight="600" fill="#d93025" text-anchor="middle">jumper: 3V3</text>
    <g font-size="14" text-anchor="end" fill="#202124">
      <text x="184" y="111">3V3</text>
      <text x="184" y="139">GND</text>
      <text x="184" y="167">TXD</text>
      <text x="184" y="195">RTS/DTR</text>
      <text x="184" y="225" fill="#80868b" font-size="12">RXD: not connected</text>
    </g>
    <g fill="#202124">
      <circle cx="200" cy="106" r="5"/><circle cx="200" cy="134" r="5"/><circle cx="200" cy="162" r="5"/><circle cx="200" cy="190" r="5"/>
    </g>
  </g>

  <!-- TB-03F (terminals only; physical positions: see pinout) -->
  <g transform="translate(520,96)">
    <rect x="0" y="0" width="200" height="212" rx="8" fill="#1b2a4a"/>
    <text x="110" y="30" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">TB-03F</text>
    <g font-size="14" fill="#ffffff">
      <text x="16" y="111">3V3</text><text x="58" y="111" font-size="11" fill="#c9d1e3">left column, bottom</text>
      <text x="16" y="139">GND</text><text x="58" y="139" font-size="11" fill="#c9d1e3">right column, bottom</text>
      <text x="16" y="167">SWS</text><text x="58" y="167" font-size="11" fill="#c9d1e3">left column, 3rd</text>
      <text x="16" y="195">RST</text><text x="58" y="195" font-size="11" fill="#c9d1e3">left column, top</text>
    </g>
    <g fill="#c9a227">
      <rect x="-6" y="100" width="12" height="12" rx="2"/><rect x="-6" y="128" width="12" height="12" rx="2"/>
      <rect x="-6" y="156" width="12" height="12" rx="2"/><rect x="-6" y="184" width="12" height="12" rx="2"/>
    </g>
  </g>

  <!-- wires -->
  <g stroke-width="4" fill="none" stroke-linecap="round">
    <line x1="245" y1="202" x2="514" y2="202" stroke="#d93025"/>
    <line x1="245" y1="230" x2="514" y2="230" stroke="#202124"/>
    <line x1="245" y1="258" x2="514" y2="258" stroke="#1a73e8"/>
    <line x1="245" y1="286" x2="514" y2="286" stroke="#e8710a" stroke-dasharray="10 8"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="380" y="196" fill="#d93025">3.3 V power</text>
    <text x="380" y="224" fill="#202124">ground</text>
    <text x="380" y="252" fill="#1a73e8">TX → SWS (data)</text>
    <text x="380" y="280" fill="#e8710a">optional: reset</text>
  </g>

  <text x="24" y="346" font-size="13" fill="#202124">Never connect the adapter's 3V3 while a CR2032 is in the holder: a coin cell must not be charged.</text>
  <text x="24" y="366" font-size="13" fill="#202124">5 V logic can damage the TLSR8253. Only TX is needed; RXD stays unconnected.</text>
</svg>
